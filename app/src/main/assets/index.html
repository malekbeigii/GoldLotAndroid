<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماشین‌حساب حجم و ریسک طلا</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ee;--surface:#fff;--ink:#1d2428;--muted:#667178;--line:#ddd8c9;--brass:#9a6b12;--buy:#13795b;--sell:#b4322f;--field:#faf8f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14181a;--surface:#1d2326;--ink:#ecebe4;--muted:#93a0a6;--line:#2f383c;--brass:#d9a441;--buy:#4cc9a0;--sell:#f0716d;--field:#161b1d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14181a;--surface:#1d2326;--ink:#ecebe4;--muted:#93a0a6;--line:#2f383c;--brass:#d9a441;--buy:#4cc9a0;--sell:#f0716d;--field:#161b1d}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.45rem;font-weight:800;margin:6px 0 12px}
h2{font-size:1rem;font-weight:800;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1}
button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button.on{border-color:var(--brass);color:var(--brass);font-weight:800}
button.pri{background:var(--brass);color:var(--surface);border-color:var(--brass);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
details.panel>summary{cursor:pointer;font-weight:800}
details.panel[open]>summary{margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
input,select{width:100%}
input{font:inherit;font-size:1.02rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 11px;direction:ltr;text-align:left}
.hint{font-size:.78rem;color:var(--muted);margin-top:2px}
.side{display:inline-block;font-weight:800;padding:1px 14px;border-radius:999px;border:1.5px solid}
.buy{color:var(--buy)}.sell{color:var(--sell)}.side.buy{border-color:var(--buy)}.side.sell{border-color:var(--sell)}
.lot{font-size:2.8rem;font-weight:800;color:var(--brass);line-height:1.2;direction:ltr;text-align:right}
.muted{color:var(--muted);font-size:.86rem;margin:0}
table{width:100%;border-collapse:collapse;margin-top:10px}
td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
td:last-child{text-align:left;direction:ltr;font-weight:600;white-space:nowrap}
.loss{color:var(--sell)}.gain{color:var(--buy)}
.warn{margin:10px 0 0;padding:9px 12px;border-radius:10px;border:1px solid var(--sell);color:var(--sell);font-size:.88rem}
.warn.ok{border-color:var(--line);color:var(--muted)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sub{margin:14px 0 0;font-weight:800;font-size:.92rem}
.scroll{overflow-x:auto}
.j td:last-child{white-space:normal}
.j input{width:90px;padding:4px 8px}
svg{width:100%;height:120px;margin-top:8px}
input.t,textarea{direction:rtl;text-align:right}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 11px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.jc summary{font-weight:600;font-size:.92rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>ماشین‌حساب حجم و ریسک طلا</h1>
<p class="muted" id="dt" style="margin:-4px 0 12px"></p>
<div class="tabs"><button id="t1" class="on" type="button">محاسبه</button><button id="t2" type="button">ژورنال</button></div>

<div id="calc">
<details class="panel" id="setd" open><summary>تنظیمات حساب و قوانین پراپ</summary>
<div class="grid">
<div><label for="bal">بالانس حساب ($)</label><input id="bal" type="number" inputmode="decimal" value="5000" step="any"></div>
<div><label for="risk">ریسک در هر معامله (٪)</label><input id="risk" type="number" inputmode="decimal" value="0.5" step="any"></div>
<div><label for="spread">اسپرد ($)</label><input id="spread" type="number" inputmode="decimal" placeholder="مثلاً 0.3" step="any"></div>
<div><label for="cs">اندازه کانترکت (اونس در هر لات)</label><input id="cs" type="number" inputmode="decimal" value="100" step="any"></div>
<div><label for="lev">لوریج (برای مارجین)</label><input id="lev" type="number" inputmode="decimal" value="100" step="any"></div>
<div><label for="dd1">سقف افت روزانه (٪)</label><input id="dd1" type="number" inputmode="decimal" value="5" step="any"></div>
<div><label for="dd2">سقف افت کل (٪)</label><input id="dd2" type="number" inputmode="decimal" value="10" step="any"></div>
<div><label for="td">ضرر امروز تا الان ($)</label><input id="td" type="number" inputmode="decimal" placeholder="0" step="any"><div class="hint">عدد مثبت بزنید. اگر خالی باشد از ژورنال امروز حساب می‌شود.</div></div>
<div class="full"><label for="tt">ضرر کل از ابتدای حساب ($)</label><input id="tt" type="number" inputmode="decimal" placeholder="0" step="any"></div>
<div><label for="mt">حداکثر معامله در روز</label><input id="mt" type="number" inputmode="decimal" value="3" step="any"></div>
<div><label for="ml">حداکثر ضرر پشت‌سرهم در روز</label><input id="ml" type="number" inputmode="decimal" value="2" step="any"></div>
<div><label for="gt">هدف سود فاز پراپ (٪)</label><input id="gt" type="number" inputmode="decimal" value="8" step="any"></div>
<div><label for="gd">حداقل روز معاملاتی</label><input id="gd" type="number" inputmode="decimal" value="0" step="any"></div>
<div class="full"><label for="ckEdit">چک‌لیست قبل از ورود (هر خط یک مورد)</label><textarea id="ckEdit" rows="5">سطح یا ستاپ تایید شده است
خبر مهم نزدیک نیست
استاپ پشت یک سطح معتبر است
ریسک از سقف مجاز بیشتر نیست
از نظر ذهنی آماده معامله هستم</textarea></div>
</div></details>

<section class="panel"><h2>معامله</h2>
<div class="grid">
<div class="full"><label for="mode">حالت محاسبه</label><select id="mode"><option value="risk">لات را از ریسک حساب کن</option><option value="lot">لات دلخواه دارم، ریسک را نشان بده</option></select></div>
<div id="lotw" class="full" hidden><label for="lotIn">لات</label><input id="lotIn" type="number" inputmode="decimal" placeholder="مثلاً 0.05" step="any"></div>
<div><label for="dir">جهت</label><select id="dir"><option value="auto">خودکار (از روی استاپ)</option><option value="buy">خرید</option><option value="sell">فروش</option></select></div>
<div><label for="entry">قیمت ورود</label><input id="entry" type="number" inputmode="decimal" placeholder="مثلاً 4132" step="any"></div>
<div><label for="slm">استاپ بر حسب</label><select id="slm"><option value="price">قیمت</option><option value="dist">فاصله ($)</option></select></div>
<div><label for="sl" id="sll">استاپ‌لاس</label><input id="sl" type="number" inputmode="decimal" placeholder="مثلاً 4137" step="any"></div>
<div><label for="tpm">تارگت بر حسب</label><select id="tpm"><option value="price">قیمت</option><option value="r">نسبت R</option></select></div>
<div><label for="tp" id="tpl">تارگت (اختیاری)</label><input id="tp" type="number" inputmode="decimal" placeholder="مثلاً 4115" step="any"></div>
<div><label for="pp">خروج پله‌ای: درصد حجم (٪)</label><input id="pp" type="number" inputmode="decimal" value="50" step="any"></div>
<div><label for="pr">خروج پله‌ای: در چند R</label><input id="pr" type="number" inputmode="decimal" value="2" step="any"></div>
<div><label for="setup">ستاپ / استراتژی</label><input class="t" id="setup" type="text" placeholder="مثلاً شکست سطح، پولبک"></div>
<div><label for="conf">اعتماد به معامله</label><select id="conf"><option value="">-</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
<div><label for="sess">سشن</label><select id="sess"><option value="">-</option><option>آسیا</option><option>لندن</option><option>نیویورک</option><option>هم‌پوشانی لندن و نیویورک</option></select></div>
<div><label for="tf">تایم‌فریم</label><select id="tf"><option value="">-</option><option>M5</option><option>M15</option><option>H1</option><option>H4</option><option>D1</option></select></div>
<div class="full"><label for="why">علت ورود</label><input class="t" id="why" type="text" placeholder="چرا وارد می‌شوید؟ مثلاً بریک‌اوت سطح روی H1"></div>
</div></section>

<section class="panel"><h2>چک‌لیست قبل از ورود</h2><div id="ck"></div><div class="row"><button type="button" id="ckb2">ویرایش موارد چک‌لیست</button></div></section>

<section class="panel" id="out" aria-live="polite"></section>
</div>

<div id="jr" hidden>
<section class="panel"><h2>آمار</h2><div id="stats"></div><svg id="eq" viewBox="0 0 300 120" preserveAspectRatio="none" role="img" aria-label="نمودار سود و زیان تجمعی"></svg>
<p class="muted" style="margin:8px 0 0">بالا: منحنی سود و زیان تجمعی. پایین: افت از آخرین اوج.</p>
<svg id="dd" viewBox="0 0 300 120" preserveAspectRatio="none" role="img" aria-label="نمودار افت سرمایه"></svg></section>
<h2 style="margin:6px 2px 10px">معاملات ثبت‌شده</h2><div id="jl"></div><div class="row"><button type="button" id="clr">پاک‌کردن کل ژورنال</button></div>
<section class="panel" style="margin-top:14px"><h2>پشتیبان‌گیری</h2>
<div class="row" style="margin-top:0"><button class="pri" type="button" id="bkj">دانلود پشتیبان (JSON)</button><button type="button" id="bkv">دانلود CSV</button><button type="button" id="bkc">کپی پشتیبان</button></div>
<p class="sub">بازیابی</p>
<div class="row"><input type="file" id="bkf" accept=".json,application/json"></div>
<label for="bkta" style="margin-top:8px">یا متن پشتیبان را اینجا بچسبانید</label>
<textarea id="bkta" rows="3" style="direction:ltr;text-align:left"></textarea>
<div class="row"><button type="button" id="bkr">بازیابی از متن</button></div>
<p class="muted" id="bkm" style="margin-top:6px"></p></section>
</div>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var SET=["bal","risk","spread","cs","lev","dd1","dd2","td","tt","mode","dir","slm","tpm","pp","pr","mt","ml","gt","gd","ckEdit"];
var ALL=SET.concat(["entry","sl","tp","lotIn"]);
function sget(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var saved=sget("gl.set")||{};
SET.forEach(function(i){if(saved[i]!==undefined)$(i).value=saved[i]});
var journal=sget("gl.j");
if(!Array.isArray(journal))journal=[];
function norm(j){
  var o={d:"",ts:null,buy:true,en:0,slP:null,tpP:null,cs:100,lot:0.01,risk:1,rr:null,setup:"",sess:"",tf:"",why:"",conf:"",res:null,exitP:null,xr:"",plan:"",note:"",ck:"",tags:[],shot:""};
  for(var k in j)o[k]=j[k];
  if(!o.id)o.id=Date.now()+Math.floor(Math.random()*1e9);
  if(!o.ts&&o.id>1e12&&o.id<2e12)o.ts=Math.floor(o.id);
  if(!o.risk)o.risk=1;
  if(!Array.isArray(o.tags))o.tags=[];
  return o}
journal=journal.filter(function(j){return j&&typeof j==="object"}).map(norm);
var last=null;
function today(){return new Date().toLocaleDateString("en-GB")}
var FAF,FAS,FAN,GRF,GRS;
try{
  FAF=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  FAS=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",month:"long",day:"numeric"});
  FAN=new Intl.DateTimeFormat("fa-IR-u-ca-persian-nu-latn",{year:"numeric",month:"2-digit",day:"2-digit"});
  GRF=new Intl.DateTimeFormat("en-GB",{weekday:"long",day:"2-digit",month:"short",year:"numeric"});
  GRS=new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}catch(e){}
function faParts(d,y){var o={};FAF.formatToParts(d).forEach(function(p){o[p.type]=p.value});return o.weekday+" "+o.day+" "+o.month+(y?" "+o.year:"")}
function tm(d){return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
function dtxt(ts){try{var d=new Date(ts);return faParts(d,1)+" | "+GRF.format(d)}catch(e){return ""}}
function dsum(j){try{var d=new Date(j.ts);return faParts(d,0)+" · "+GRS.format(d)}catch(e){return j.d||""}}
function dfull(j){return j.ts?dtxt(j.ts)+" · ساعت "+tm(new Date(j.ts)):(j.d||"")}
function progHtml(bal){
  var gt=n("gt"),gd=n("gd");if(!(gt>0)||!(bal>0))return "";
  var cl=journal.filter(function(j){return j.res!==null}),tot=0,days={};
  cl.forEach(function(j){tot+=j.res;days[j.d]=1});
  var tgt=bal*gt/100,pct=Math.max(0,tot/tgt*100),nd=Object.keys(days).length;
  var h='<p class="sub">پیشرفت تا هدف پراپ</p><div style="height:8px;border-radius:6px;background:var(--line);margin-top:6px"><div style="height:100%;width:'+Math.min(100,pct).toFixed(1)+'%;background:var(--brass);border-radius:6px"></div></div><table><tr><td>سود ثبت‌شده / هدف</td><td class="'+(tot>=0?"gain":"loss")+'">'+m(tot)+' / $'+f(tgt,2)+'</td></tr><tr><td>پیشرفت</td><td>'+f(pct,1)+'٪ (باقی‌مانده $'+f(Math.max(0,tgt-tot),2)+')</td></tr>';
  if(gd>0)h+='<tr><td>روزهای معاملاتی</td><td>'+nd+' از '+f(gd,0)+'</td></tr>';
  return h+'</table>'}
function ymd(){return new Date().toISOString().slice(0,10)}
function backupJson(){var st={};SET.forEach(function(k){st[k]=$(k).value});return JSON.stringify({app:"gold-journal",v:2,exported:new Date().toISOString(),settings:st,journal:journal},null,1)}
function csvEsc(x){x=x==null?"":String(x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}
function toCsv(){
  var rows=[["تاریخ میلادی","تاریخ شمسی","روز هفته","ساعت","جهت","ستاپ","سشن","تایم‌فریم","لات","ورود","استاپ","تارگت","ریسک $","RR","خروج","نتیجه $","R","علت خروج","طبق پلن","چک‌لیست","اعتماد","اشتباهات","علت ورود","یادداشت","اسکرین‌شات"]];
  journal.forEach(function(j){
    var d=j.ts?new Date(j.ts):null,gd="",fd="",wd="",t="";
    try{if(d){gd=GRS.format(d);fd=FAN.format(d);wd=new Intl.DateTimeFormat("fa-IR",{weekday:"long"}).format(d);t=tm(d)}}catch(e){}
    rows.push([gd||j.d,fd,wd,t,j.buy?"Buy":"Sell",j.setup,j.sess,j.tf,j.lot,j.en,j.slP,j.tpP,j.risk,j.rr,j.exitP,j.res,j.res===null?"":(j.res/j.risk).toFixed(2),j.xr,j.plan,j.ck,j.conf,j.tags.join(" | "),j.why,j.note,j.shot])});
  return "\ufeff"+rows.map(function(r){return r.map(csvEsc).join(",")}).join("\n")}
function bkmsg(t){$("bkm").textContent=t}
function dl(name,data){
  if(window.Android && typeof window.Android.saveFile === "function"){
    window.Android.saveFile(name,data);bkmsg("محل ذخیره فایل را انتخاب کنید.");return;
  }
  var blob=new Blob([data],{type:name.slice(-4)===".csv"?"text/csv;charset=utf-8":"application/json;charset=utf-8"});
  var a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);
  bkmsg("اگر دانلود شروع نشد، از «کپی پشتیبان» استفاده کنید.");
}
function importText(t){
  try{
    var o=JSON.parse(t),arr=Array.isArray(o)?o:o.journal;
    if(!Array.isArray(arr))throw new Error("ساختار فایل نامعتبر است");
    var ids={},add=0;journal.forEach(function(j){ids[j.id]=1});
    arr.forEach(function(x){if(x&&typeof x==="object"){var j=norm(x);if(!ids[j.id]){journal.push(j);ids[j.id]=1;add++}}});
    journal.sort(function(a,b){return (a.ts||a.id)-(b.ts||b.id)});
    if(o&&!Array.isArray(o)&&o.settings){SET.forEach(function(k){if(o.settings[k]!==undefined)$(k).value=o.settings[k]});sset("gl.set",o.settings);buildCk()}
    sset("gl.j",journal);render();calc();bkmsg(add+" معامله جدید بازیابی شد.")
  }catch(e){bkmsg("بازیابی نشد: "+e.message)}}
function ckItems(){return $("ckEdit").value.split("\n").map(function(x){return x.trim()}).filter(Boolean)}
function buildCk(){$("ck").innerHTML=ckItems().map(function(t){return '<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.95rem;margin:4px 0"><input type="checkbox" class="ckb" style="width:auto"> '+esc(t)+'</label>'}).join("")}
function ckState(){var b=document.querySelectorAll(".ckb"),c=0;for(var i=0;i<b.length;i++)if(b[i].checked)c++;return {c:c,n:b.length}}

function n(i){var v=parseFloat($(i).value);return isNaN(v)?NaN:v}
function f(x,d){if(typeof x!=="number"||isNaN(x))return "-";return x.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function m(x){return (x<0?"-":"+")+"$"+f(Math.abs(x),2)}
function msg(t){$("out").innerHTML='<span class="muted">'+t+'</span>';last=null}

ALL.forEach(function(i){$(i).addEventListener("input",function(){
  if(SET.indexOf(i)>-1){var o={};SET.forEach(function(k){o[k]=$(k).value});sset("gl.set",o)}
  calc()})});
["mode","slm","tpm"].forEach(function(i){$(i).addEventListener("change",calc)});

function calc(){
  $("lotw").hidden=$("mode").value!=="lot";
  $("sll").textContent=$("slm").value==="dist"?"فاصله استاپ ($)":"استاپ‌لاس";
  $("tpl").textContent=$("tpm").value==="r"?"تارگت (R، اختیاری)":"تارگت (اختیاری)";
  var bal=n("bal"),rp=n("risk"),sp=n("spread"),cs=n("cs"),lev=n("lev"),dd1=n("dd1"),dd2=n("dd2"),td=n("td"),tt=n("tt");
  var en=n("entry"),sl=n("sl"),tp=n("tp"),pp=n("pp"),pr=n("pr");
  var tdy=today(),tj=journal.filter(function(j){return j.d===tdy}),jlz=0,streak=0;
  tj.forEach(function(j){if(j.res!==null&&j.res<0)jlz-=j.res});
  for(var q=tj.length-1;q>=0;q--){if(tj[q].res!==null&&tj[q].res<0)streak++;else if(tj[q].res!==null)break}
  if(isNaN(sp))sp=0; if(isNaN(td))td=jlz; if(isNaN(tt))tt=0;
  if([bal,rp,cs].some(isNaN)||bal<=0||rp<=0||cs<=0)return msg("بالانس، ریسک و اندازه کانترکت را با عدد معتبر پر کنید.");
  if([en,sl].some(isNaN))return msg("قیمت ورود و استاپ را وارد کنید تا نتیجه نمایش داده شود.");
  var dv=$("dir").value,buy,slDist;
  if($("slm").value==="price"){
    if(en===sl)return msg("ورود و استاپ نمی‌توانند برابر باشند.");
    buy=sl<en; slDist=Math.abs(en-sl);
    if((dv==="buy"&&!buy)||(dv==="sell"&&buy))return msg("جهت انتخاب‌شده با جای استاپ نمی‌خواند.");
  }else{
    if(dv==="auto")return msg("وقتی استاپ را به‌صورت فاصله می‌دهید، جهت را روی خرید یا فروش بگذارید.");
    if(sl<=0)return msg("فاصله استاپ باید بزرگ‌تر از صفر باشد.");
    buy=dv==="buy"; slDist=sl;
  }

$("jl").addEventListener("click",function(e){var id=e.target.getAttribute("data-del");if(!id)return;if(!e.target.getAttribute("data-armed")){e.target.setAttribute("data-armed","1");e.target.textContent="دوباره بزنید تا حذف شود";return}journal=journal.filter(function(j){return String(j.id)!==id});sset("gl.j",journal);render()});

$("t2").onclick=function(){$("calc").hidden=true;$("jr").hidden=false;$("t2").className="on";$("t1").className="";render()};

$("ckb2").onclick=function(){$("setd").open=true;var e=$("ckEdit");if(e.scrollIntoView)e.scrollIntoView({block:"center"});e.focus()};

$("bkc").onclick=function(){var t=backupJson();$("bkta").value=t;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){bkmsg("پشتیبان کپی شد و در کادر پایین هم هست.")},function(){bkmsg("کپی خودکار انجام نشد. متن را از کادر پایین کپی کنید.")});
  else bkmsg("متن پشتیبان در کادر پایین است؛ کپی کنید.")};
$("bkr").onclick=function(){var t=$("bkta").value.trim();if(!t){bkmsg("ابتدا متن پشتیبان را بچسبانید.");return}importText(t)};
$("bkf").addEventListener("change",function(e){var fl=e.target.files&&e.target.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){importText(String(r.result))};r.onerror=function(){bkmsg("فایل خوانده نشد.")};r.readAsText(fl)});
$("dt").textContent=dtxt(Date.now());
$("ckEdit").addEventListener("input",buildCk);
var out=$("out");buildCk();calc();render();
})();
